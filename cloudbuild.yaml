substitutions:
  _REGION: us-central1
  _REPOSITORY: incidentiq
  _TAG: manual

timeout: 1800s

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --build-arg=GIT_COMMIT_SHA=${_TAG}
      - -f
      - Dockerfile.cloud
      - --target=api
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --build-arg=GIT_COMMIT_SHA=${_TAG}
      - -f
      - Dockerfile.ui
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ui:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ui:${_TAG}
