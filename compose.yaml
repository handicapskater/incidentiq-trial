services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - type: bind
        source: ${GGUF_MODEL_PATH:?Set GGUF_MODEL_PATH to an absolute host path}
        target: /models/model.gguf
        read_only: true
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      target: api
    environment:
      MODEL_PROVIDER: llama
      LLAMA_URL: http://llama:8080
      CHROMA_PATH: /app/data/chroma
      DATA_DIR: /app/data
    volumes:
      - incidentiq-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      llama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ui:
    build:
      context: .
      target: ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  incidentiq-data:
