services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-m", "/models/model.gguf", "--ctx-size", "4096", "--parallel", "1", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - type: bind
        source: ${GGUF_MODEL_PATH:?Set GGUF_MODEL_PATH to an absolute host path}
        target: /models/model.gguf
        read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      target: api
    environment:
      MODEL_PROVIDER: llama
      LLAMA_URL: ${INCIDENTIQ_LOCAL_LLAMA_URL:-http://llama:8080}
      CHROMA_PATH: /app/data/chroma
      DATA_DIR: /app/data
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      INCIDENTIQ_API_KEY: ${INCIDENTIQ_API_KEY:-}
    volumes:
      - incidentiq-data:/app/data
      - ./incidentiq:/app/incidentiq:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      llama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8000
      INCIDENTIQ_API_KEY: ${INCIDENTIQ_API_KEY:-}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  incidentiq-data:
